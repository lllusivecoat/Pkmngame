# Recover the v0.65 build whose game checks passed but Pages publishing failed.
# The old artifact expires after one day; verification rejects expired/unverified builds.
name: Recover tested Pages build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-pages.yml', '.github/scripts/deploy-pages.cjs']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish-tested:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pages-recovery]')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify previously tested source and artifact
        id: verified
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const runId=45355835625, source='55b185b6fd03a61fdd0c46deedaa593555422607';
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:runId})).data;
            if(run.head_sha!==source)throw Error('Unexpected recovery source');
            const jobs=(await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:runId})).data.jobs;
            for(const name of ['Run npm test','Browser gameplay checks']){
              if(!jobs.some(job=>job.steps.some(step=>step.name===name&&step.conclusion==='success')))throw Error('Required checks did not pass: '+name);
            }
            const diff=(await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:source+'...'+context.sha})).data;
            if(!diff.files?.length||diff.files.some(file=>!file.filename.startsWith('.github/')))throw Error('Runtime source differs from the tested build');
            const artifacts=(await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:runId})).data.artifacts;
            const artifact=artifacts.find(a=>a.id===14903440861&&!a.expired);
            if(!artifact||artifact.digest!=='sha256:49e1304190ecd715214c90da8df72d19f8f1c9faa337499335474cdf9fb2b15f')throw Error('Recovery artifact missing, expired, or changed');
            core.setOutput('artifact_id',artifact.id);
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.verified.outputs.artifact_id }}
          run-id: 45355835625
          github-token: ${{ github.token }}
          path: recovered
          merge-multiple: true
      - name: Verify Pages archive
        run: test -f recovered/artifact.tar
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: github-pages-recovered-${{ github.run_id }}
          path: recovered/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deploy=require('./.github/scripts/deploy-pages.cjs');
            await deploy({github,context,core,artifactId:'${{ steps.upload.outputs.artifact-id }}'});
