name: Publish Greenwood
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run stage
      - name: Install pinned browser test driver
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Browser gameplay checks
        run: node scripts/browser-smoke.mjs
      - name: Save browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: .browser-artifacts
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .site
      - name: Wait for Pages artifact availability
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'github-pages-${{ github.run_id }}-${{ github.run_attempt }}';
            for (let attempt = 0; attempt < 12; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, per_page: 100
              });
              const matches = data.artifacts.filter(a => a.name === artifactName && !a.expired);
              if (matches.length === 1) { core.info('Pages artifact is ready.'); return; }
              if (matches.length > 1) throw new Error('Duplicate Pages artifact for this attempt.');
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages artifact did not become available within 55 seconds.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
