name: Publish Greenwood
on:
  push:
    branches: [main]
    paths-ignore: [".github/**"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run stage
      - name: Install pinned browser test driver
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Browser gameplay checks
        run: |
          (
            set -e
            node scripts/browser-smoke.mjs
          ) &
          broad_pid=$!
          (
            set -e
            node scripts/party-roster-status74-browser-smoke.mjs
            node scripts/world-polish73-browser-smoke.mjs
            node scripts/music-window-browser-smoke.mjs
            node scripts/economy-travel-browser-smoke.mjs
            node scripts/companion-life-browser-smoke.mjs
            node scripts/trainer-sheet-browser-smoke.mjs
            node scripts/care-services-browser-smoke.mjs
            node scripts/battle-scroll-smoke.mjs
            node scripts/gym-design-smoke.mjs
            node scripts/shop-developer-smoke.mjs
            node scripts/battle-presentation-smoke.mjs
            node scripts/welcome-rewards-smoke.mjs
            node scripts/johto-hunting-smoke.mjs
            node scripts/nursery-browser-smoke.mjs
            node scripts/career-browser-smoke.mjs
            node scripts/visitors-browser-smoke.mjs
            node scripts/map-performance-smoke.mjs
            node scripts/rk3-browser-smoke.mjs
            node scripts/all-forms-browser-smoke.mjs
            node scripts/gym-browser-smoke.mjs
            node scripts/gen789-browser-smoke.mjs
            node scripts/temporary-art-browser-smoke.mjs
          ) &
          focused_pid=$!
          # Functional failures should surface immediately; the broad suite includes offline/PWA coverage.
          if ! wait "$focused_pid"; then
            kill "$broad_pid" 2>/dev/null || true
            wait "$broad_pid" 2>/dev/null || true
            exit 1
          fi
          wait "$broad_pid"
      - name: Save browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: .browser-artifacts
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .site
      - name: Wait for Pages artifact availability
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'github-pages-${{ github.run_id }}-${{ github.run_attempt }}';
            for (let attempt = 0; attempt < 12; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, per_page: 100
              });
              const matches = data.artifacts.filter(a => a.name === artifactName && !a.expired);
              if (matches.length === 1) { core.setOutput('artifact_id', matches[0].id); core.info('Pages artifact is ready.'); return; }
              if (matches.length > 1) throw new Error('Duplicate Pages artifact for this attempt.');
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages artifact did not become available within 55 seconds.');
      - name: Deploy
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deploy = require('./.github/scripts/deploy-pages.cjs');
            await deploy({github, context, core, artifactId: '${{ steps.artifact.outputs.artifact_id }}'});
