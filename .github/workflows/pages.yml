name: Publish Gymbound
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run the complete regression and artwork catalogue suite
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select relevant checks
        id: checks
        env:
          BEFORE: ${{ github.event.before }}
          FULL_CHECKS: ${{ inputs.full_checks }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD^)
          fi
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --depth=1 origin "$base"
          if [ "$FULL_CHECKS" = "true" ]; then
            node scripts/select-checks.mjs --base "$base" --full
          else
            node scripts/select-checks.mjs --base "$base"
          fi
      - uses: actions/cache@v4
        id: dependencies
        with:
          path: node_modules
          key: node22-${{ runner.os }}-${{ steps.checks.outputs.dependency_key }}
      - if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache@v4
        id: engine
        with:
          path: |
            vendor/simulator.js
            vendor/LICENSE-*.txt
          key: engine-node22-${{ steps.checks.outputs.engine_key }}
      - if: steps.engine.outputs.cache-hit != 'true'
        run: npm run build:engine
      - name: Targeted unit checks
        run: npm run test:changed
      - run: npm run stage
      - name: Install pinned browser test driver
        if: steps.checks.outputs.browsers == 'true'
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Targeted browser checks
        if: steps.checks.outputs.browsers == 'true'
        run: npm run test:browser:changed
      - name: Save browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: .browser-artifacts
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .site
      - name: Wait for Pages artifact availability
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'github-pages-${{ github.run_id }}-${{ github.run_attempt }}';
            for (let attempt = 0; attempt < 12; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, per_page: 100
              });
              const matches = data.artifacts.filter(a => a.name === artifactName && !a.expired);
              if (matches.length === 1) { core.setOutput('artifact_id', matches[0].id); core.info('Pages artifact is ready.'); return; }
              if (matches.length > 1) throw new Error('Duplicate Pages artifact for this attempt.');
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages artifact did not become available within 55 seconds.');
      - name: Deploy
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deploy = require('./.github/scripts/deploy-pages.cjs');
            await deploy({github, context, core, artifactId: '${{ steps.artifact.outputs.artifact_id }}'});
